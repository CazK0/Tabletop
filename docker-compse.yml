version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: rpg_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rpg_world
    ports:
      - "5432:5432"
    volumes:
      - rpg_db_data:/var/lib/postgresql/data

volumes:
  rpg_db_data: